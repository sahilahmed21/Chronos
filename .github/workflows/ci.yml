name: ci

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      swarm_seeds:
        description: "Swarm seed count (push/PR default 32; nightly runs 100000)"
        required: false
        default: "32"
        type: string
      swarm_start:
        description: "First swarm seed (default 1). Use the start seed a failed nightly logged to reproduce it."
        required: false
        default: "1"
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  agent:
    name: agent-harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test
        working-directory: agent
        run: PYTHONPATH=. uv run --no-project --with pytest python -m pytest tests -q --ignore=tests/experimental
      - name: Experimental sandbox tests (informational; hosted runners may block user namespaces)
        continue-on-error: true
        working-directory: agent
        run: PYTHONPATH=. uv run --no-project --with pytest python -m pytest tests/experimental -q -rs
      - name: Detection table (fails if a planted bug is missed or the control fires)
        working-directory: agent
        run: PYTHONPATH=. uv run --no-project python -m chronos_agent detect --seeds 2000

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        timeout-minutes: 30
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --release

      - name: Test with deliberate-bug hooks (planted regressions, ADR-0002)
        timeout-minutes: 30
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --workspace --release --features chronos-sim/mutants

      - name: Clippy (protocol + sim)
        run: |
          cargo clippy -p chronos-protocol -p chronos-sim --all-targets -- -D warnings
          cargo clippy -p chronos-protocol -p chronos-sim --all-targets --features chronos-sim/mutants -- -D warnings

      - name: Determinism gates (HashMap / host I/O)
        run: bash scripts/check-determinism-gates.sh

      - name: Swarm seed range
        id: swarm
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Rotating range: each night covers 100000 seeds nobody has run before.
            echo "count=100000" >> "$GITHUB_OUTPUT"
            echo "start=$(( ${{ github.run_number }} * 100000 ))" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "count=${{ github.event.inputs.swarm_seeds || '32' }}" >> "$GITHUB_OUTPUT"
            echo "start=${{ github.event.inputs.swarm_start || '1' }}" >> "$GITHUB_OUTPUT"
          else
            echo "count=32" >> "$GITHUB_OUTPUT"
            echo "start=1" >> "$GITHUB_OUTPUT"
          fi
          # Logged so a failure reproduces: chronos-sim --seed <failing seed>, or rerun this range.
          S=$(grep '^start=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          C=$(grep '^count=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          echo "swarm seeds: start=$S count=$C (last=$(( S + C - 1 )))"
          echo "swarm seeds: start=$S count=$C" >> "$GITHUB_STEP_SUMMARY"

      - name: Create traces dir
        run: mkdir -p traces

      - name: Swarm (fail job on any CheckFail)
        timeout-minutes: 120
        run: >
          cargo run -p chronos-sim --release --
          --seeds ${{ steps.swarm.outputs.count }}
          --start ${{ steps.swarm.outputs.start }}
          --out traces
          --coverage
